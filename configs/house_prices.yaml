data_type: auto

data:
  source: "unified_pipeline/data/house_prices/train.csv"
  target: SalePrice
  drop_columns:
    - Id

supervised:
  task: regression

split:
  train_val_test: [0.7, 0.15, 0.15]
  stratify: true
  random_state: 42

model:
  type: random_forest
  params:
    n_estimators: 200
    random_state: 42
    n_jobs: -1
  search: null

xai:
  feature_importance: true
  shap: true
  lime: true
  num_features: 10
  num_instances: 3
  narrative: true
  top_features: 15
  use_llm: true

output:
  dir: "unified_pipeline/outputs"
  save_model: true
  save_report: true