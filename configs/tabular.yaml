data_type: auto

data:
  source: "sklearn:breast_cancer"
  # source: "unified_pipeline/data/house_prices/train.csv"
  target: auto

supervised:
  task: classification  # classification | regression | auto

split:
  train_val_test: [0.7, 0.15, 0.15]
  stratify: true
  random_state: 42

model:
  type: random_forest
  params:
    n_estimators: 300
    criterion: gini
    max_features: sqrt
    random_state: 42
    n_jobs: -1
  search: null

xai:
  feature_importance: true
  shap: true
  lime: true
  num_features: 10
  num_instances: 3
  narrative: true   # reporte estilo agente (explicaciones en lenguaje natural)
  top_features: 15  # nº de características destacadas en la narrativa

output:
  dir: "unified_pipeline/outputs"
  save_model: true
  save_report: true

