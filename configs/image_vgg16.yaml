data_type: auto

data:
  source: "unified_pipeline/data/PetImages"
  target: auto

model:
  type: vgg16
  variant: vgg16            # vgg16 | vgg16_bn
  pretrained: true
  dropout: 0.5
  device: "0"               # "0" | "cpu" | "auto"
  train:
    epochs: 30
    imgsz: 224
    batch: 32
    workers: 4
    optimizer: adam          # adam | sgd | adamw
    lr: 0.0001
    patience: 5
    seed: 42
    augment: false           # per spec: no augmentation
    label_smoothing: 0.0
    predict_demo: 4
    split: [0.7, 0.15, 0.15]  # for flat PetImages (Cat/Dog)

xai:
  narrative: true
  use_llm: false
  methods: [gradcam, occlusion]
  gradcam:
    layer: features.28
  occlusion:
    grid: [8, 8]

output:
  dir: "unified_pipeline/outputs"
  save_model: true
  save_report: true
