data_type: auto

data:
  source: "sklearn:breast_cancer"
  target: auto

supervised:
  task: classification  # classification | regression | auto

split:
  train_val_test: [0.7, 0.15, 0.15]
  stratify: true
  random_state: 42

model:
  # Requires: pip install xgboost (guarded import in tabular/supervised/models.py)
  type: xgboost
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
  search: null

xai:
  feature_importance: true  # feature_importances_
  shap: true                # TreeExplainer (fast path via is_tree_based XGB check)
  lime: true                # predict_proba
  num_features: 10
  num_instances: 3
  narrative: true
  top_features: 15
  use_llm: true

output:
  dir: "unified_pipeline/outputs"
  save_model: true
  save_report: true
